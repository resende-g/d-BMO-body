; Firmware próprio do d-BMO v1 para o ESP32-S3 N16R8 (DevKitC-1 na bancada).
; O Bruce e o Retro-Go são firmwares separados, com build próprio em firmware/bruce e
; firmware/retro-go. Os testes que rodam no computador usam CMake (ver docs/testing).
;
;   pio run                      compila o perfil de bancada
;   pio run -t upload            compila e grava pela USB
;   pio run -e dbmo-target       compila com a pinagem proposta do v1 completo
;   pio test -e dbmo-bench       testes de bancada (tests/hardware), com a placa ligada

[platformio]
default_envs = dbmo-bench
src_dir = firmware/app/src
include_dir = firmware/app/include
test_dir = tests/hardware

[env]
; Mesma plataforma que o Bruce 1.16.1 fixa (pioarduino 55.03.39 = Arduino-ESP32 3.3.9).
; Ela exige o PlatformIO Core 6.1.19 ou mais novo.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
; 16 MB de flash, 8 MB de PSRAM octal (memory_type qio_opi), partições default_16MB.
board = esp32-s3-devkitc1-n16r8
monitor_speed = 115200
test_framework = unity
build_flags =
	; Console pela porta USB nativa (USB-Serial-JTAG). O UART0 fica livre.
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-Wall
	-Wextra
lib_deps =
	adafruit/Adafruit ILI9341@^1.6.1
	symlink://${PROJECT_DIR}/firmware/config
	symlink://${PROJECT_DIR}/firmware/core
	symlink://${PROJECT_DIR}/firmware/display
	symlink://${PROJECT_DIR}/firmware/rosto
	symlink://${PROJECT_DIR}/firmware/input
	symlink://${PROJECT_DIR}/firmware/audio
	symlink://${PROJECT_DIR}/firmware/radio
	symlink://${PROJECT_DIR}/firmware/nfc
	symlink://${PROJECT_DIR}/firmware/infrared
	symlink://${PROJECT_DIR}/firmware/storage
	symlink://${PROJECT_DIR}/firmware/power
	symlink://${PROJECT_DIR}/firmware/cartridges
	symlink://${PROJECT_DIR}/firmware/platform/esp32s3

; Protoboard de hoje: tela + três botões ligados direto em GPIO (pins.h, perfil bench).
[env:dbmo-bench]
build_flags =
	${env.build_flags}
	-DDBMO_PROFILE_BENCH=1

; Pinagem proposta do v1 completo (pins.h, perfil target). Compila para acompanhar a
; evolução; só faz sentido gravar quando o hardware correspondente estiver montado.
[env:dbmo-target]
build_flags =
	${env.build_flags}
	-DDBMO_PROFILE_TARGET=1
