# d-BMO-body v1 — registro de dimensões em formato legível por máquina.
#
# Este arquivo é a fonte das tabelas de docs/mechanical/COMPONENT_DIMENSIONS.md
# (bloco gerado por render_register.py) e a entrada de generate_models.py.
#
# Regras:
#   - status CONFIRMADO: valor lido nesta data em documento dimensional publicado
#     pelo fabricante (fonte com origin: fabricante e url). Só estas dimensões
#     podem virar geometria.
#   - status NOMINAL: valor de anúncio, de designação da peça ou de medida de
#     régua registrada no README. Não vira geometria.
#   - status PENDENTE: sem valor (value: null). Medir com paquímetro.
#   - Nunca escrever um valor sem fonte. Nunca promover uma linha a CONFIRMADO
#     sem abrir o documento do fabricante e registrar a URL em sources.

